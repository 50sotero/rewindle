<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'" />
    <!-- No theme class on <html>. The first frame follows prefers-color-scheme: the desktop host sets the web view's preferred
         color scheme to the theme it resolved, app.css carries the dark tokens for it, and the app then pins .dark or .light. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#101927" />
    <meta name="description" content="Rewindle — Backup you can verify. Encrypted snapshots and guided recovery, powered by Restic." />
    <link rel="icon" href="./rewindle-icon.svg" type="image/svg+xml" />

  </head>
