name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-safety-tests:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # The dashboard interface is bundled with Node.js; .node-version pins the release line that
      # src/dashboard/web/package.json accepts.
      - name: Set up Node.js for the dashboard interface
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: src/dashboard/web/package-lock.json

      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall -q src tests

      - name: Parse PowerShell without executing it
        shell: pwsh
        run: |
          $hadErrors = $false
          Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Recurse -File -Filter '*.ps1' |
            Where-Object { $_.FullName -notmatch '[\\/]node_modules[\\/]' } |
            ForEach-Object {
              $tokens = $null
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                $_.FullName,
                [ref]$tokens,
                [ref]$errors
              )
              foreach ($parseError in $errors) {
                Write-Error "$($_.FullName):$($parseError.Extent.StartLineNumber): $($parseError.Message)" -ErrorAction Continue
                $hadErrors = $true
              }
            }
          if ($hadErrors) { exit 1 }

      # Includes the dashboard source and harness checks under tests/; none of them reads a real
      # installation (the harnesses move every engine folder into a disposable temp root).
      - name: Run isolated unit and repository-hygiene tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Exercise protected source-management transactions
        shell: powershell
        run: .\tests\Test-ManageSources.ps1

      # Installs the locked web dependencies, type-checks and bundles the dashboard interface, downloads
      # and verifies the pinned WebView2 SDK, compiles the dashboard host and the task launcher with the
      # .NET Framework compiler, and assembles the checksum-pinned payload and setup executable.
      - name: Build checksum-pinned Windows release
        shell: pwsh
        run: .\build\Build-Release.ps1

      # Windows PowerShell 5.1 on purpose: the checks load the .NET Framework dashboard just built.
      # -SkipInstalledChecks keeps them from reading any installed backup configuration.
      - name: Dashboard regression checks
        shell: powershell
        run: .\src\dashboard\tests\restore-flow-regressions.ps1 -SkipInstalledChecks

      # Single protected restore requests and restore approval sessions in the disposable mode, including the dashboard
      # just built talking to the session broker. -SkipInstalledChecks keeps it from reading any installation. The manager
      # refuses its disposable mode under an elevated token, and hosted Windows runners execute every step as an
      # administrator with UAC off, so the suite runs as a temporary standard user with its own temp folder. It only reads
      # the checkout and writes below that temp folder.
      - name: Exercise protected restore requests and restore sessions
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $user = 'rewindle-ci'
          $password = ConvertTo-SecureString -String ('Rw!' + [Guid]::NewGuid().ToString('N') + 'a9') -AsPlainText -Force
          # New-LocalUser never prompts (net.exe asks to confirm passwords longer than 14 characters). The account joins only
          # BUILTIN\Users, which holds the local logon right the secondary-logon service needs.
          New-LocalUser -Name $user -Password $password -PasswordNeverExpires -AccountNeverExpires | Out-Null
          Add-LocalGroupMember -SID 'S-1-5-32-545' -Member $user
          $tempRoot = 'C:\rewindle-ci-temp'
          New-Item -ItemType Directory -Path $tempRoot -Force | Out-Null
          $pythonDirectory = Split-Path -Parent (Get-Command python -ErrorAction Stop).Source
          foreach ($grant in @(@($tempRoot, 'F'), @($env:GITHUB_WORKSPACE, 'RX'), @($pythonDirectory, 'RX'))) {
            & icacls.exe $grant[0] /grant ('{0}:(OI)(CI){1}' -f $user, $grant[1]) /Q | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Could not grant the test user access to $($grant[0])." }
          }
          Start-Service -Name seclogon
          $script = Join-Path $env:GITHUB_WORKSPACE 'tests\Test-ManageRestore.ps1'
          $command = @"
          `$env:TEMP = '$tempRoot'; `$env:TMP = '$tempRoot'; `$env:PATH = '$pythonDirectory;' + `$env:PATH
          try { & '$script' -SkipInstalledChecks; exit 0 } catch { Write-Output (`$_ | Out-String); exit 1 }
          "@
          $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($command))
          $credential = New-Object System.Management.Automation.PSCredential($user, $password)
          $stdout = Join-Path $tempRoot 'suite.stdout.log'
          $stderr = Join-Path $tempRoot 'suite.stderr.log'
          $process = Start-Process -FilePath (Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe') `
            -ArgumentList '-NoProfile', '-ExecutionPolicy', 'Bypass', '-EncodedCommand', $encoded `
            -Credential $credential -LoadUserProfile -WorkingDirectory $env:GITHUB_WORKSPACE `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr -Wait -PassThru
          Get-Content -LiteralPath $stdout, $stderr -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) { throw "Test-ManageRestore.ps1 failed as a standard user (exit $($process.ExitCode))." }

      - name: Exercise two real snapshots and an independent restore
        shell: pwsh
        run: .\tests\Test-ReleaseArtifact.ps1
