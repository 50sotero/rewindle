name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-safety-tests:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      # The dashboard interface is bundled with Node.js; .node-version pins the release line that
      # src/dashboard/web/package.json accepts.
      - name: Set up Node.js for the dashboard interface
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: src/dashboard/web/package-lock.json

      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall -q src tests

      - name: Parse PowerShell without executing it
        shell: pwsh
        run: |
          $hadErrors = $false
          Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Recurse -File -Filter '*.ps1' |
            Where-Object { $_.FullName -notmatch '[\\/]node_modules[\\/]' } |
            ForEach-Object {
              $tokens = $null
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                $_.FullName,
                [ref]$tokens,
                [ref]$errors
              )
              foreach ($parseError in $errors) {
                Write-Error "$($_.FullName):$($parseError.Extent.StartLineNumber): $($parseError.Message)" -ErrorAction Continue
                $hadErrors = $true
              }
            }
          if ($hadErrors) { exit 1 }

      # Includes the dashboard source and harness checks under tests/; none of them reads a real
      # installation (the harnesses move every engine folder into a disposable temp root).
      - name: Run isolated unit and repository-hygiene tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Exercise protected source-management transactions
        shell: powershell
        run: .\tests\Test-ManageSources.ps1

      # Installs the locked web dependencies, type-checks and bundles the dashboard interface, downloads
      # and verifies the pinned WebView2 SDK, compiles the dashboard host and the task launcher with the
      # .NET Framework compiler, and assembles the checksum-pinned payload and setup executable.
      - name: Build checksum-pinned Windows release
        shell: pwsh
        run: .\build\Build-Release.ps1

      # Compiles the setup program's logic (installer\setup, without its window) with the .NET Framework compiler and checks the
      # installer contract, the progress-file reader, ZIP unpacking, folder measurement, plan mode (against a stub script), the
      # install flow (against a fake launcher) and the message bridge's validation. It never starts the setup program or an installer.
      - name: Setup host checks
        shell: powershell
        run: .\tests\Test-SetupHost.ps1

      # Windows PowerShell 5.1 on purpose: the checks load the .NET Framework dashboard just built.
      # -SkipInstalledChecks keeps them from reading any installed backup configuration.
      - name: Dashboard regression checks
        shell: powershell
        run: .\src\dashboard\tests\restore-flow-regressions.ps1 -SkipInstalledChecks

      # Backup alerts (why a backup was missed, the failing count, when a notification is shown, alerts.json, the tray mark).
      # The suite compiles the dashboard sources with a fixture harness: no task is queried, nothing is started, and every
      # file it writes is under a fresh folder in TEMP. It and the task schedule suite below are separate steps, so each runs
      # in its own PowerShell process: both compile the same dashboard types, and one process cannot add a type name twice.
      - name: Backup alert checks
        shell: powershell
        run: .\tests\Test-BackupAlerts.ps1

      # The Task Scheduler reader the backup alerts depend on, checked against fixture task definitions with the same kind
      # of harness: no task is queried and nothing is started.
      - name: Task schedule checks
        shell: powershell
        run: .\tests\Test-TaskSchedule.ps1

      # Single protected restore requests and restore approval sessions in the disposable mode, including the dashboard
      # just built talking to the session broker, then clean-up of old backups through its protected manager against a
      # stand-in restic.exe. -SkipInstalledChecks keeps them from reading any installation. The managers
      # refuse their disposable mode under an elevated token, and hosted Windows runners execute every step as an
      # administrator with UAC off, so the suite runs as a temporary standard user with its own temp folder. It only reads
      # the checkout and writes below that temp folder.
      - name: Exercise protected restore requests, restore sessions and clean-up
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $user = 'rewindle-ci'
          $password = ConvertTo-SecureString -String ('Rw!' + [Guid]::NewGuid().ToString('N') + 'a9') -AsPlainText -Force
          # New-LocalUser never prompts (net.exe asks to confirm passwords longer than 14 characters). The account joins only
          # BUILTIN\Users, which holds the local logon right the secondary-logon service needs.
          New-LocalUser -Name $user -Password $password -PasswordNeverExpires -AccountNeverExpires | Out-Null
          Add-LocalGroupMember -SID 'S-1-5-32-545' -Member $user
          $tempRoot = 'C:\rewindle-ci-temp'
          New-Item -ItemType Directory -Path $tempRoot -Force | Out-Null
          $pythonDirectory = Split-Path -Parent (Get-Command python -ErrorAction Stop).Source
          foreach ($grant in @(@($tempRoot, 'F'), @($env:GITHUB_WORKSPACE, 'RX'), @($pythonDirectory, 'RX'))) {
            & icacls.exe $grant[0] /grant ('{0}:(OI)(CI){1}' -f $user, $grant[1]) /Q | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Could not grant the test user access to $($grant[0])." }
          }
          Start-Service -Name seclogon
          $script = Join-Path $env:GITHUB_WORKSPACE 'tests\Test-ManageRestore.ps1'
          $retentionScript = Join-Path $env:GITHUB_WORKSPACE 'tests\Test-ManageRetention.ps1'
          # The commands go in a script file in the temp folder. A process started with -Credential (CreateProcessWithLogonW)
          # gets at most 1,024 characters of command line, and an -EncodedCommand naming both suites is longer.
          $runner = Join-Path $tempRoot 'run-suites.ps1'
          $command = @"
          `$env:TEMP = '$tempRoot'; `$env:TMP = '$tempRoot'; `$env:PATH = '$pythonDirectory;' + `$env:PATH
          try { & '$script' -SkipInstalledChecks; & '$retentionScript' -SkipInstalledChecks; exit 0 } catch { Write-Output (`$_ | Out-String); exit 1 }
          "@
          [IO.File]::WriteAllText($runner, $command, [Text.UTF8Encoding]::new($true))
          $credential = New-Object System.Management.Automation.PSCredential($user, $password)
          $stdout = Join-Path $tempRoot 'suite.stdout.log'
          $stderr = Join-Path $tempRoot 'suite.stderr.log'
          $process = Start-Process -FilePath (Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe') `
            -ArgumentList '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $runner `
            -Credential $credential -LoadUserProfile -WorkingDirectory $env:GITHUB_WORKSPACE `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr -Wait -PassThru
          Get-Content -LiteralPath $stdout, $stderr -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) { throw "Test-ManageRestore.ps1 or Test-ManageRetention.ps1 failed as a standard user (exit $($process.ExitCode))." }

      - name: Exercise two real snapshots and an independent restore
        shell: pwsh
        run: .\tests\Test-ReleaseArtifact.ps1

      # The installer's machine-readable backend (docs/setup-contract.md): plan mode, the progress feed writer and the
      # decision functions. Plan mode is pointed at fixture folders and a fixture temp folder, so nothing is installed and
      # no real Program Files, ProgramData or profile folder is read. It also runs elevated here; the local run is unelevated.
      - name: Exercise the installer plan mode and progress feed
        shell: powershell
        run: .\tests\Test-InstallPlan.ps1

      # A REAL install and uninstall on this disposable hosted runner, driven the way a setup wizard drives them: plan mode
      # as a standard user, an unattended install with a progress feed (as a test administrator named by -ExpectedUserSid),
      # a refused second install, an uninstall with a progress feed, and a check that the machine is clean afterwards. The
      # script refuses to run anywhere but a GitHub-hosted runner; it uses the release the build step produced.
      - name: Exercise the installer contract end to end
        shell: powershell
        run: .\tests\Test-InstallerContract.ps1 -AllowSystemInstall
