name: Windows installers

# This release is Windows-only: the macOS desktop host is not part of this repository.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: src/dashboard/web/package-lock.json
      - name: Run isolated backend and hygiene checks
        shell: pwsh
        run: python -m unittest discover -s tests -v
      - name: Build the Windows payload and setup installer
        shell: pwsh
        run: .\build\Build-Release.ps1
      # Windows PowerShell 5.1: the checks load the .NET Framework dashboard the release build just compiled.
      - name: Dashboard regression checks
        shell: powershell
        run: .\src\dashboard\tests\restore-flow-regressions.ps1 -SkipInstalledChecks
      - name: Verify real backup and independent restore
        shell: pwsh
        run: .\tests\Test-ReleaseArtifact.ps1
      - name: Package the editable brand kit
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $name = "Rewindle-v$version-brand-kit.zip"
          git archive --format=zip --output="artifacts/$name" HEAD brand
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash -LiteralPath "artifacts/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $PWD "artifacts/$name.sha256"), "$hash *$name`n")
      - name: Upload Windows installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64
          if-no-files-found: error
          path: |
            artifacts/*.exe
            artifacts/*.zip
            artifacts/*SHA256*
            artifacts/*sha256*

  # Signed build provenance for the files a release publishes: anyone can check with
  # "gh attestation verify" that a download was built by this workflow from this repository.
  # A job of its own, so the OIDC token that signs it is never available while the build
  # installs dependencies and runs the tests. Publish the workflow's files unchanged, or their
  # digests no longer match.
  attest:
    name: Attest build provenance
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the Windows installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64
          path: artifacts
      - name: Attest the setup program, the ZIP and the brand kit
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/*.exe
            artifacts/*.zip
